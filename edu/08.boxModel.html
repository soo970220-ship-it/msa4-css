<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>box model</title>
    <link rel="stylesheet" href="./08.css" />
  </head>
  <body>
    <span>span1</span>
    <span>span2</span>
    <h1 class="box1">제목1</h1>
    <h1 class="box2">제목2</h1>
    <div class="box-margin">마진1</div>
    <div class="box-margin">마진2</div>

    <span class*2="span-display">스판 디스플레이</span>
    <span class="span-display">스판디스플레이</span>
    <span class="span-display">스판디스플레이</span>
    <div class="div-display">div 디스플레이</div>
    <div class="div-display">div 디스플레이</div>
  </body>
</html>
